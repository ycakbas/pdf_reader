[package]
name = "pdf_reader"
version = "0.1.0"
edition = "2024"
description = "Ultra-fast cross-platform PDF reader with configurable controls and PDF theming"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = "0.37"
pdfium-render = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
